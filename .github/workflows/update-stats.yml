name: Update stats

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - assets/**
  schedule:
    - cron: "5 18 * * *" 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate stats
        run: python scripts/update_stats.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/progress.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update stats [skip ci]"
            git pull --rebase
            git push
          fi
